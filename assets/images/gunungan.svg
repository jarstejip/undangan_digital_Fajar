<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa771c" />
      <stop offset="100%" stop-color="#5a3d07" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fff4cc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#aa771c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)" opacity="0.3">
    <!-- Outer Glow Silhouette -->
    <path d="M250,30 C265,90 280,120 320,180 C360,240 420,310 435,420 C450,530 400,600 370,640 C340,680 320,700 250,710 C180,700 160,680 130,640 C100,600 50,530 65,420 C80,310 140,240 180,180 C220,120 235,90 250,30 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Main Gunungan Silhouette Border -->
  <path d="M250,35 C263,92 278,122 318,182 C356,240 415,310 430,418 C444,525 396,594 366,634 C337,673 315,692 250,702 C185,692 163,673 134,634 C104,594 56,525 70,418 C85,310 144,240 182,182 C222,122 237,92 250,35 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Double Border -->
  <path d="M250,55 C260,105 272,132 308,190 C344,245 400,312 414,414 C426,512 382,576 354,614 C327,651 306,670 250,680 C194,670 173,651 146,614 C118,576 74,512 86,414 C100,312 156,245 192,190 C228,132 240,105 250,55 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="8,4" opacity="0.85"/>

  <!-- Gunungan Top Finial / Makutha -->
  <path d="M250,15 L254,35 L250,42 L246,35 Z" fill="url(#goldGrad)"/>
  <circle cx="250" cy="12" r="5" fill="url(#goldGrad)"/>

  <!-- Central Trunk / Pohon Hayat (Tree of Life) -->
  <path d="M246,700 L246,260 Q246,240 250,220 Q254,240 254,260 L254,700 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <rect x="238" y="700" width="24" height="28" rx="3" fill="url(#goldGrad)"/>

  <!-- Gapura / Paduraksa (Sacred Temple Portal at Base) -->
  <g id="gapura">
    <!-- Base Platform -->
    <path d="M165,650 L335,650 L320,620 L180,620 Z" fill="url(#goldGrad)" opacity="0.5"/>
    <path d="M180,620 L320,620 L310,595 L190,595 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <!-- Pillars -->
    <rect x="195" y="520" width="16" height="75" rx="2" fill="url(#goldGrad)"/>
    <rect x="289" y="520" width="16" height="75" rx="2" fill="url(#goldGrad)"/>
    <!-- Portal Arch -->
    <path d="M195,520 Q250,470 305,520 L305,530 Q250,485 195,530 Z" fill="url(#goldGrad)"/>
    <!-- Doorway Wing Ornaments -->
    <path d="M175,540 C185,530 195,545 195,560 C185,565 170,555 175,540 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <path d="M325,540 C315,530 305,545 305,560 C315,565 330,555 325,540 Z" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Door Handles / Twin Central Medallions -->
    <circle cx="235" cy="555" r="7" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="265" cy="555" r="7" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>

  <!-- Intricate Tree Branches & Foliage (Lir-Liran Lung-Lungan) -->
  <!-- Level 1 Foliage Branches -->
  <path d="M250,420 Q290,390 350,410 C320,430 280,425 250,440" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M250,420 Q210,390 150,410 C180,430 220,425 250,440" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="350" cy="410" r="5" fill="url(#goldGrad)"/>
  <circle cx="150" cy="410" r="5" fill="url(#goldGrad)"/>

  <!-- Level 2 Foliage Branches -->
  <path d="M250,340 Q310,290 370,330 C340,350 290,340 250,360" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M250,340 Q190,290 130,330 C160,350 210,340 250,360" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="370" cy="330" r="6" fill="url(#goldGrad)"/>
  <circle cx="130" cy="330" r="6" fill="url(#goldGrad)"/>

  <!-- Level 3 Foliage Branches -->
  <path d="M250,260 Q300,200 340,240 C310,255 280,245 250,270" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M250,260 Q200,200 160,240 C190,255 220,245 250,270" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="340" cy="240" r="4.5" fill="url(#goldGrad)"/>
  <circle cx="160" cy="240" r="4.5" fill="url(#goldGrad)"/>

  <!-- Level 4 Crown Spire Foliage -->
  <path d="M250,170 Q280,120 300,150 C280,165 265,155 250,180" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <path d="M250,170 Q220,120 200,150 C220,165 235,155 250,180" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  
  <!-- Sacred Birds / Garuda / Peacock Whispers at Branches -->
  <g id="sacredBirds">
    <!-- Left Peacock Shape -->
    <path d="M190,300 C175,285 160,290 155,305 C150,320 165,330 185,320 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <circle cx="158" cy="295" r="3" fill="#fff4cc"/>
    <!-- Right Peacock Shape -->
    <path d="M310,300 C325,285 340,290 345,305 C350,320 335,330 315,320 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <circle cx="342" cy="295" r="3" fill="#fff4cc"/>
  </g>

  <!-- Center Mandala Lotus of Harmony -->
  <g id="lotusCenter" transform="translate(250, 460)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" opacity="0.4"/>
    <circle cx="0" cy="0" r="5" fill="url(#goldGrad)"/>
    <!-- 8 Petals -->
    <path d="M0,-22 Q6,-12 0,0 Q-6,-12 0,-22 Z" fill="url(#goldGrad)"/>
    <path d="M0,22 Q6,12 0,0 Q-6,12 0,22 Z" fill="url(#goldGrad)"/>
    <path d="M-22,0 Q-12,6 0,0 Q-12,-6 -22,0 Z" fill="url(#goldGrad)"/>
    <path d="M22,0 Q12,6 0,0 Q12,-6 22,0 Z" fill="url(#goldGrad)"/>
    <path d="M-15,-15 Q-4,-12 0,0 Q-12,-4 -15,-15 Z" fill="url(#goldGrad)"/>
    <path d="M15,-15 Q4,-12 0,0 Q12,-4 15,-15 Z" fill="url(#goldGrad)"/>
    <path d="M-15,15 Q-4,12 0,0 Q-12,4 -15,15 Z" fill="url(#goldGrad)"/>
    <path d="M15,15 Q4,12 0,0 Q12,4 15,15 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Bottom Sacred Base Flames / Lidah Api -->
  <g id="baseFlames" opacity="0.75">
    <path d="M250,670 C240,650 245,635 250,620 C255,635 260,650 250,670 Z" fill="url(#goldGrad)"/>
    <path d="M220,660 C212,645 218,630 224,622 C226,634 232,646 220,660 Z" fill="url(#goldGrad)"/>
    <path d="M280,660 C288,645 282,630 276,622 C274,634 268,646 280,660 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
