  <circle cx="260" cy="38" r="3" fill="url(#divGold)"/>
  <circle cx="220" cy="40" r="3" fill="url(#divGold)"/>
  <circle cx="180" cy="39" r="2.5" fill="url(#divGold)"/>

  <!-- Right Spirals and Flourish -->
  <path d="M320,40 C340,25 360,55 380,40 C400,25 420,50 450,40 L600,40" fill="none" stroke="url(#divGold)" stroke-width="2"/>
  <circle cx="340" cy="38" r="3" fill="url(#divGold)"/>
  <circle cx="380" cy="40" r="3" fill="url(#divGold)"/>
  <circle cx="420" cy="39" r="2.5" fill="url(#divGold)"/>

  <!-- Top and Bottom accent dots -->
  <circle cx="300" cy="6" r="2" fill="url(#divGold)"/>
  <circle cx="300" cy="74" r="2" fill="url(#divGold)"/>
</svg>
