<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0" />
      <stop offset="25%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fff1b8" />
      <stop offset="75%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Center Diamond & Flowers -->
  <path d="M300,15 L320,40 L300,65 L280,40 Z" fill="url(#divGold)"/>
  <circle cx="300" cy="40" r="5" fill="#111218"/>
  <circle cx="300" cy="40" r="2.5" fill="#fff1b8"/>

  <!-- Left Spirals and Flourish -->
